name: Build Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: libmpv et ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-x86_64-2*.7z" -O mpv.7z
          7z e mpv.7z libmpv-2.dll -y
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z e ffmpeg.zip "*/bin/ffmpeg.exe" -y
          ls -la libmpv-2.dll ffmpeg.exe
      - run: pyinstaller --noconfirm --onefile --windowed --name ProLogicPlayer --add-binary "libmpv-2.dll;." --add-binary "ffmpeg.exe;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProLogicPlayer
          path: dist/ProLogicPlayer.exe
